# I-020 electron-builder 配置：Windows NSIS 安装包 + portable 单文件。
# 产物结构：electron-vite 的 out/（main / preload / renderer 三段）+ package.json。
# I-022 瘦身：主进程只外部化 chokidar（其余依赖已被 vite 打进 out/ 的 bundle，
# 不再让 electron-builder 把 64 个生产依赖重复塞进 asar）；语言包只留中英。
appId: dev.markdowneditor.app
productName: markdown_editor
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/**"
electronLanguages:
  - en-US
  - zh-CN
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
